# Opt-in deployment profile. The default and prod profiles keep proxy forwarding disabled.
loadbalancerpro.auth.mode=api-key
loadbalancerpro.auth.protect-actuator=true

loadbalancerpro.proxy.enabled=true
loadbalancerpro.proxy.strategy=${LBP_PROXY_STRATEGY:ROUND_ROBIN}
loadbalancerpro.proxy.connect-timeout=${LBP_CONNECT_TIMEOUT:1s}
loadbalancerpro.proxy.request-timeout=${LBP_REQUEST_TIMEOUT:30s}
loadbalancerpro.proxy.max-request-bytes=${LBP_MAX_REQUEST_BYTES:65536}
loadbalancerpro.proxy.max-response-bytes=${LBP_MAX_RESPONSE_BYTES:0}
loadbalancerpro.proxy.forwarded.mode=${LBP_FORWARDED_MODE:strip-and-set}
loadbalancerpro.proxy.health-check.enabled=true
loadbalancerpro.proxy.health-check.path=${LBP_HEALTH_CHECK_PATH:/health}
loadbalancerpro.proxy.health-check.timeout=${LBP_HEALTH_CHECK_TIMEOUT:1s}
loadbalancerpro.proxy.health-check.interval=${LBP_HEALTH_CHECK_INTERVAL:5s}
loadbalancerpro.proxy.health-check.healthy-threshold=${LBP_HEALTHY_THRESHOLD:2}
loadbalancerpro.proxy.health-check.unhealthy-threshold=${LBP_UNHEALTHY_THRESHOLD:3}
loadbalancerpro.proxy.cooldown.enabled=true
loadbalancerpro.proxy.cooldown.consecutive-failure-threshold=${LBP_COOLDOWN_FAILURE_THRESHOLD:2}
loadbalancerpro.proxy.cooldown.duration=${LBP_COOLDOWN_DURATION:30s}
loadbalancerpro.proxy.cooldown.recover-on-successful-health-check=true
loadbalancerpro.proxy.limits.max-in-flight=${LBP_MAX_IN_FLIGHT:100}
loadbalancerpro.proxy.limits.adaptive=false
loadbalancerpro.proxy.reload.drain-timeout=${LBP_DRAIN_TIMEOUT:30s}
loadbalancerpro.proxy.slow-start.duration=${LBP_SLOW_START_DURATION:5s}

loadbalancerpro.proxy.upstreams[0].id=${LBP_UPSTREAM_0_ID:backend-a}
loadbalancerpro.proxy.upstreams[0].url=${LBP_UPSTREAM_0_URL}
loadbalancerpro.proxy.upstreams[0].max-in-flight=${LBP_UPSTREAM_0_MAX_IN_FLIGHT:50}
loadbalancerpro.proxy.upstreams[0].tls.client-cert=${LBP_UPSTREAM_0_CLIENT_CERT_BUNDLE:}
loadbalancerpro.proxy.upstreams[1].id=${LBP_UPSTREAM_1_ID:backend-b}
loadbalancerpro.proxy.upstreams[1].url=${LBP_UPSTREAM_1_URL}
loadbalancerpro.proxy.upstreams[1].max-in-flight=${LBP_UPSTREAM_1_MAX_IN_FLIGHT:50}
loadbalancerpro.proxy.upstreams[1].tls.client-cert=${LBP_UPSTREAM_1_CLIENT_CERT_BUNDLE:}
loadbalancerpro.proxy.backend-tls.truststore=${LBP_BACKEND_TRUST_BUNDLE:}

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.otlp.metrics.export.enabled=false
management.metrics.tags.environment=proxy-prod
