name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, Package, Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        # actions/checkout@v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java
        # actions/setup-java@v4.8.0
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve dependency tree
        run: mvn -B -DskipTests dependency:tree

      - name: Run tests
        run: mvn -B test

      - name: Verify zero skipped tests
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "target/surefire-reports/*.xml" > /dev/null; then
            echo "No Surefire XML reports found."
            exit 1
          fi

          total_tests="$({ grep -hoE 'tests="[0-9]+"' target/surefire-reports/*.xml || true; } | cut -d'"' -f2 | awk '{ total += $1 } END { print total + 0 }')"
          skipped_tests="$({ grep -hoE 'skipped="[0-9]+"' target/surefire-reports/*.xml || true; } | cut -d'"' -f2 | awk '{ total += $1 } END { print total + 0 }')"

          echo "Surefire tests reported: ${total_tests}"
          echo "Surefire skipped tests reported: ${skipped_tests}"

          if [ "${skipped_tests}" -ne 0 ]; then
            echo "Skipped tests must be documented instead of hidden."
            exit 1
          fi

      - name: Verify four test-scope proof families ran
        shell: bash
        run: |
          set -euo pipefail

          for proof_report in \
            EnterpriseLabAllocationProofRunnerTest \
            EnterpriseLabEvidenceOwnershipProofCommandTest \
            EnterpriseLabDurableRecoveryProofCommandTest \
            EnterpriseLabExperimentProofRunnerTest
          do
            report="target/surefire-reports/TEST-com.richmond423.loadbalancerpro"
            case "$proof_report" in
              EnterpriseLabAllocationProofRunnerTest|EnterpriseLabExperimentProofRunnerTest)
                report="${report}.lab.${proof_report}.xml"
                ;;
              *)
                report="${report}.cli.${proof_report}.xml"
                ;;
            esac
            test -f "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -Eq 'failures="0"' "$report"
            grep -Eq 'errors="0"' "$report"
            grep -Eq 'skipped="0"' "$report"
          done

      - name: Run test-scope independent-supervisor proof
        shell: pwsh
        run: ./scripts/smoke/enterprise-lab-independent-supervisor-proof.ps1 -OutputDir target/ci-independent-supervisor-proof

      - name: Generate JaCoCo coverage report
        run: mvn -B jacoco:report

      - name: Summarize JaCoCo coverage
        shell: bash
        run: |
          set -euo pipefail

          report="target/site/jacoco/jacoco.csv"
          if [ ! -f "$report" ]; then
            echo "JaCoCo CSV report not found at $report"
            exit 1
          fi

          awk -F, '
            NR > 1 {
              instruction_missed += $4;
              instruction_covered += $5;
              branch_missed += $6;
              branch_covered += $7;
              line_missed += $8;
              line_covered += $9;
            }
            END {
              instruction_total = instruction_missed + instruction_covered;
              branch_total = branch_missed + branch_covered;
              line_total = line_missed + line_covered;
              instruction_pct = instruction_total ? (100 * instruction_covered / instruction_total) : 0;
              branch_pct = branch_total ? (100 * branch_covered / branch_total) : 0;
              line_pct = line_total ? (100 * line_covered / line_total) : 0;
              printf "JaCoCo instruction coverage: %.2f%% (%d/%d)%s", instruction_pct, instruction_covered, instruction_total, ORS;
              printf "JaCoCo branch coverage: %.2f%% (%d/%d)%s", branch_pct, branch_covered, branch_total, ORS;
              printf "JaCoCo line coverage: %.2f%% (%d/%d)%s", line_pct, line_covered, line_total, ORS;
            }
          ' "$report"

      - name: Upload JaCoCo coverage artifacts
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco
          retention-days: 30

      - name: Package executable JAR
        run: mvn -B -DskipTests package

      - name: Verify packaged artifact resources
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="target/artifact-smoke"
          mkdir -p "$OUTPUT_DIR"

          JAR="$(bash scripts/resolve-executable-jar.sh)"

          SUMMARY="$OUTPUT_DIR/artifact-smoke-summary.txt"
          SHA_OUTPUT="$OUTPUT_DIR/artifact-sha256.txt"
          RESOURCE_LIST="$OUTPUT_DIR/jar-resource-list.txt"

          jar tf "$JAR" | sort > "$RESOURCE_LIST"
          sha256sum "$JAR" > "$SHA_OUTPUT"

          {
            echo "LoadBalancerPro packaged artifact smoke"
            echo "Artifact: $JAR"
            echo "Release-free: workflow artifact/log evidence only; no tags, GitHub releases, or release assets."
            echo ""
            echo "SHA-256:"
            cat "$SHA_OUTPUT"
            echo ""
            echo "Required jar entries:"
          } > "$SUMMARY"

          require_entry() {
            local entry="$1"
            if ! grep -Fxq "$entry" "$RESOURCE_LIST"; then
              echo "Missing required jar entry: $entry" | tee -a "$SUMMARY"
              exit 1
            fi
            echo "OK: $entry" | tee -a "$SUMMARY"
          }

          require_entry "META-INF/MANIFEST.MF"
          require_entry "BOOT-INF/classes/static/proxy-status.html"
          require_entry "BOOT-INF/classes/application-proxy-prod.properties"
          require_entry "BOOT-INF/classes/com/richmond423/loadbalancerpro/api/LoadBalancerApiApplication.class"
          require_entry "BOOT-INF/classes/com/richmond423/loadbalancerpro/api/proxy/ReverseProxyService.class"
          require_entry "BOOT-INF/classes/com/richmond423/loadbalancerpro/api/proxy/ReverseProxyStatusController.class"

          forbid_pattern() {
            local pattern="$1"
            local description="$2"
            if grep -Eq "$pattern" "$RESOURCE_LIST"; then
              echo "Forbidden production artifact content: $description" | tee -a "$SUMMARY"
              grep -E "$pattern" "$RESOURCE_LIST" | tee -a "$SUMMARY"
              exit 1
            fi
            echo "ABSENT: $description" | tee -a "$SUMMARY"
          }

          forbid_pattern '^BOOT-INF/classes/com/richmond423/loadbalancerpro/(cli|demo|gui|lab)/' \
            "lab, demo, GUI, or CLI application classes"
          forbid_pattern '^BOOT-INF/classes/com/richmond423/loadbalancerpro/api/(AllocatorController|DecisionExplorer|EnterpriseLab|Evidence|Lase|Remediation|RoutingController|ScenarioReplay)' \
            "simulation API controllers and services"
          forbid_pattern '^BOOT-INF/classes/com/richmond423/loadbalancerpro/core/(CloudManager|LoadBalancer|ServerMonitor)' \
            "simulation, cloud-manager, or synthetic-monitor core"
          forbid_pattern '^BOOT-INF/classes/static/(adaptive-routing|ci-evidence|decision-explorer|enterprise-lab|evidence-|index\.html|load-balancing|operator-evidence|routing-demo)' \
            "simulation and cockpit web pages"
          forbid_pattern '^BOOT-INF/lib/javafx' "OpenJFX libraries"
          forbid_pattern '^BOOT-INF/lib/(autoscaling|cloudwatch|ec2|aws-|sdk-core|reactor-core|gson)-' \
            "lab-only cloud, reactive, or JSON libraries"
          forbid_pattern '^BOOT-INF/classes/.*(Test|Tests)\.class$' "test classes"
          forbid_pattern '\.(exe|dll|msi|dmg|pkg|deb|rpm|appimage)$' "unexpected native installers or executables"
          forbid_pattern '\.(pem|p12|pfx|jks|keystore|key)$' "embedded key, certificate, or trust material"

          {
            echo ""
            echo "Output files:"
            echo "- artifact-smoke-summary.txt"
            echo "- artifact-sha256.txt"
            echo "- jar-resource-list.txt"
            echo ""
            echo "This CI smoke lane uploads workflow artifacts only and does not publish release assets."
          } >> "$SUMMARY"

      - name: Upload packaged artifact smoke output
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packaged-artifact-smoke
          path: target/artifact-smoke
          retention-days: 30

      - name: Generate CycloneDX SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=all -DoutputDirectory=target -DoutputName=bom -DincludeProvidedScope=false -Dcyclonedx.skipAttach=true

      - name: Upload CycloneDX SBOM artifacts
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: loadbalancerpro-sbom
          path: |
            target/bom.json
            target/bom.xml
          retention-days: 30

      - name: Package Lab Tools executable JAR
        run: mvn -B -P lab -DskipTests package

      - name: Smoke test LASE demo command from Lab Tools artifact
        shell: bash
        run: |
          set -euo pipefail

          assert_contains() {
            local file="$1"
            local expected="$2"
            if ! grep -Fq "$expected" "$file"; then
              echo "Expected to find: $expected"
              cat "$file"
              exit 1
            fi
          }

          assert_not_contains() {
            local file="$1"
            local unexpected="$2"
            if grep -Fq "$unexpected" "$file"; then
              echo "Unexpected output found: $unexpected"
              cat "$file"
              exit 1
            fi
          }

          assert_no_spring_startup() {
            local file="$1"
            assert_not_contains "$file" "Started LoadBalancerApiApplication"
            assert_not_contains "$file" "Tomcat started"
            assert_not_contains "$file" "SpringApplication"
          }

          HEALTHY_LOG="$(mktemp)"
          OVERLOADED_LOG="$(mktemp)"
          INVALID_LOG="$(mktemp)"
          JAR="$(bash scripts/resolve-executable-jar.sh --lab)"

          java -jar "$JAR" --lase-demo=healthy >"$HEALTHY_LOG" 2>&1
          assert_contains "$HEALTHY_LOG" "=== LoadBalancerPro LASE Synthetic Demo ==="
          assert_contains "$HEALTHY_LOG" "Evaluation ID: lase-demo-healthy"
          assert_contains "$HEALTHY_LOG" "synthetic demo"
          assert_contains "$HEALTHY_LOG" "recommendation-only"
          assert_contains "$HEALTHY_LOG" "No live AWS resources touched"
          assert_contains "$HEALTHY_LOG" "No real routing mutation"
          assert_contains "$HEALTHY_LOG" "No CloudManager calls"
          assert_no_spring_startup "$HEALTHY_LOG"

          java -jar "$JAR" --lase-demo=overloaded >"$OVERLOADED_LOG" 2>&1
          assert_contains "$OVERLOADED_LOG" "Evaluation ID: lase-demo-overloaded"
          assert_contains "$OVERLOADED_LOG" "Load Shedding:"
          assert_contains "$OVERLOADED_LOG" "Action: SHED"
          assert_contains "$OVERLOADED_LOG" "Shadow Autoscaling:"
          assert_contains "$OVERLOADED_LOG" "SCALE_UP"
          assert_contains "$OVERLOADED_LOG" "Failure Scenario:"
          assert_no_spring_startup "$OVERLOADED_LOG"

          set +e
          java -jar "$JAR" --lase-demo=invalid-name >"$INVALID_LOG" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected invalid LASE demo scenario to exit 2, got $status"
            cat "$INVALID_LOG"
            exit 1
          fi
          assert_contains "$INVALID_LOG" "Invalid LASE demo scenario"
          assert_contains "$INVALID_LOG" "Valid values:"
          assert_contains "$INVALID_LOG" "healthy"
          assert_contains "$INVALID_LOG" "overloaded"
          assert_not_contains "$INVALID_LOG" "Exception"
          assert_not_contains "$INVALID_LOG" "java.lang"
          assert_no_spring_startup "$INVALID_LOG"

      - name: Smoke test packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          APP_LOG="$(mktemp)"
          JAR="$(bash scripts/resolve-executable-jar.sh)"
          java -jar "$JAR" \
            --server.address=127.0.0.1 \
            --server.port=18080 \
            --spring.profiles.active=local >"$APP_LOG" 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/actuator/health; then
              echo "Packaged JAR smoke test passed."
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited before becoming healthy."
              cat "$APP_LOG"
              exit 1
            fi

            sleep 2
          done

          echo "Application did not return HTTP 200 from /actuator/health in time."
          cat "$APP_LOG"
          exit 1

      - name: Build Docker image
        run: docker build -t loadbalancerpro:ci .

      - name: Smoke test Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_NAME="loadbalancerpro-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
            fi
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --rm -d \
            --name "$CONTAINER_NAME" \
            -p 127.0.0.1:18081:8080 \
            -e LOADBALANCERPRO_API_KEY=CI_RUNTIME_TEST_KEY \
            loadbalancerpro:ci

          for attempt in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:18081/actuator/health; then
              echo "Docker runtime health endpoint returned HTTP 200."
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -Fxq "$CONTAINER_NAME"; then
              echo "Container exited before becoming healthy."
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
              exit 1
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Container did not return HTTP 200 from /actuator/health in time."
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
              exit 1
            fi

            sleep 2
          done

          for attempt in {1..30}; do
            health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_NAME")"
            if [ "$health_status" = "healthy" ]; then
              echo "Docker healthcheck is healthy."
              exit 0
            fi
            if [ "$health_status" = "unhealthy" ]; then
              echo "Docker healthcheck became unhealthy."
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done

          echo "Docker healthcheck did not become healthy in time."
          docker inspect "$CONTAINER_NAME"
          exit 1

      - name: Smoke test proxy-prod Compose deployment
        shell: bash
        env:
          LBP_PROXY_PROD_IMAGE: loadbalancerpro:ci
          LBP_PROXY_PROD_FIXTURE_IMAGE: loadbalancerpro:proxy-prod-fixture-ci
          LBP_PROXY_PROD_REUSE_IMAGE: "true"
        run: bash scripts/smoke/proxy-prod-compose-smoke.sh

      - name: Install checksum-verified Vegeta 12.13.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/vegeta_12.13.0_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/vegeta-12.13.0"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/tsenart/vegeta/releases/download/v12.13.0/vegeta_12.13.0_linux_amd64.tar.gz
          echo 'e8759ce45c14e18374bdccd3ba6068197bc3a9f9b7e484db3837f701b9d12e61  '"$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" vegeta
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run loopback proxy benchmark smoke
        shell: bash
        env:
          LBP_BENCH_PROJECT: lbp-bench-${{ github.run_id }}-${{ github.run_attempt }}
          LBP_BENCH_OUTPUT_DIR: target/bench/ci-smoke
          LBP_BENCH_REUSE_IMAGE: "true"
          LBP_PROXY_PROD_IMAGE: loadbalancerpro:ci
          LBP_PROXY_PROD_FIXTURE_IMAGE: loadbalancerpro:proxy-prod-fixture-ci
        run: |
          set -euo pipefail
          bash -n scripts/bench/proxy-benchmark-soak.sh
          bash scripts/bench/proxy-benchmark-soak.sh --mode validate
          bash -n scripts/bench/proxy-capacity-staircase.sh
          bash scripts/bench/proxy-capacity-staircase.sh --mode validate
          bash scripts/bench/proxy-benchmark-soak.sh --mode smoke

      - name: Validate fail-closed staging qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bench/proxy-staging-qualification.sh
          bash -n scripts/bench/staging-validator-contract-test.sh
          bash -n scripts/bench/staging-deployment-contract-test.sh
          bash -n scripts/bench/proxy-staging-capacity-staircase.sh
          bash -n scripts/bench/staging-capacity-contract-test.sh
          bash -n scripts/bench/staging-capacity-evaluator-contract-test.sh
          bash -n scripts/bench/staging-capacity-runner-contract-test.sh
          bash -n scripts/bench/kubernetes-staging-adapter-contract-test.sh
          bash -n scripts/bench/kubernetes-staging-runtime-contract-test.sh
          bash scripts/bench/staging-validator-contract-test.sh
          bash scripts/bench/staging-deployment-contract-test.sh
          bash scripts/bench/staging-capacity-contract-test.sh
          bash scripts/bench/staging-capacity-evaluator-contract-test.sh
          bash scripts/bench/kubernetes-staging-adapter-contract-test.sh
          bash scripts/bench/kubernetes-staging-runtime-contract-test.sh
          bash scripts/bench/proxy-staging-qualification.sh --mode validate
          bash scripts/bench/proxy-staging-capacity-staircase.sh --mode validate
          if bash scripts/bench/proxy-staging-qualification.sh --mode run > /tmp/staging-example-run.log 2>&1; then
            echo "The unreviewed example staging profile unexpectedly entered run mode."
            exit 1
          fi
          grep -Fq "Run mode requires reviewed staging authority" /tmp/staging-example-run.log
          if bash scripts/bench/proxy-staging-capacity-staircase.sh --mode run > /tmp/staging-capacity-example-run.log 2>&1; then
            echo "The unreviewed example staging capacity profile unexpectedly entered run mode."
            exit 1
          fi
          grep -Fq "staging capacity profile rejected:" /tmp/staging-capacity-example-run.log
          bash scripts/bench/staging-capacity-runner-contract-test.sh
          python3 -m py_compile scripts/bench/validate-staging-target.py
          python3 -m py_compile scripts/bench/validate-staging-deployment.py
          python3 -m py_compile scripts/bench/validate-staging-capacity.py
          python3 -m py_compile scripts/bench/validate-staging-capacity-sample.py
          python3 -m py_compile scripts/bench/evaluate-staging-capacity.py
          python3 -m py_compile scripts/bench/prepare-kubernetes-staging-adapters.py
          python3 -m py_compile scripts/bench/kubernetes-staging-adapter-runtime.py
          python3 -m py_compile scripts/bench/kubernetes-staging-kubectl-fixture.py

      - name: Run active-active topology smoke
        shell: bash
        env:
          LBP_TOPOLOGY_PROJECT: lbp-topology-${{ github.run_id }}-${{ github.run_attempt }}
          LBP_TOPOLOGY_OUTPUT_DIR: target/topology/ci-smoke
          LBP_TOPOLOGY_REUSE_PROXY_IMAGE: "true"
          LBP_TOPOLOGY_PROXY_IMAGE: loadbalancerpro:ci
          LBP_TOPOLOGY_FIXTURE_IMAGE: loadbalancerpro:proxy-prod-fixture-ci
          LBP_TOPOLOGY_INGRESS_IMAGE: loadbalancerpro:topology-ingress-ci
          LBP_TOPOLOGY_CANDIDATE_IMAGE: loadbalancerpro:immutable-candidate-ci
          LBP_TOPOLOGY_REJECTED_IMAGE: loadbalancerpro:immutable-rejected-ci
        run: |
          set -euo pipefail
          bash -n scripts/bench/proxy-active-active-topology.sh
          bash -n scripts/bench/topology-validator-contract-test.sh
          bash scripts/bench/topology-validator-contract-test.sh
          bash scripts/bench/proxy-active-active-topology.sh --mode validate
          bash scripts/bench/proxy-active-active-topology.sh --mode smoke

      - name: Install checksum-verified kind 0.31.0 and kubectl 1.34.3
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/kubernetes-topology-tools"
          kind_binary="${install_dir}/kind"
          kubectl_binary="${install_dir}/kubectl"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$kind_binary" \
            https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          printf '%s  %s\n' \
            'eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa' \
            "$kind_binary" | sha256sum --check --strict
          curl --fail --location --retry 3 --output "$kubectl_binary" \
            https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl
          printf '%s  %s\n' \
            'ab60ca5f0fd60c1eb81b52909e67060e3ba0bd27e55a8ac147cbc2172ff14212' \
            "$kubectl_binary" | sha256sum --check --strict
          chmod 0555 "$kind_binary" "$kubectl_binary"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run live two-zone Kubernetes topology smoke
        shell: bash
        env:
          LBP_KUBERNETES_CLUSTER: lbp-k8s-${{ github.run_id }}-${{ github.run_attempt }}
          LBP_KUBERNETES_OUTPUT_DIR: target/kubernetes/ci-smoke
          LBP_KUBERNETES_PROXY_SOURCE_IMAGE: loadbalancerpro:ci
          LBP_KUBERNETES_CANDIDATE_SOURCE_IMAGE: loadbalancerpro:immutable-candidate-ci
          LBP_KUBERNETES_FIXTURE_SOURCE_IMAGE: loadbalancerpro:proxy-prod-fixture-ci
        run: |
          set -euo pipefail
          bash -n scripts/bench/proxy-kubernetes-topology.sh
          bash -n scripts/bench/kubernetes-topology-contract-test.sh
          bash scripts/bench/kubernetes-topology-contract-test.sh
          bash scripts/bench/proxy-kubernetes-topology.sh --mode validate
          bash scripts/bench/proxy-kubernetes-topology.sh --mode smoke

      - name: Upload loopback proxy benchmark smoke reports
        if: always() && hashFiles('target/bench/ci-smoke/**') != ''
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proxy-benchmark-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/bench/ci-smoke
          retention-days: 30

      - name: Upload active-active topology smoke reports
        if: always() && hashFiles('target/topology/ci-smoke/**') != ''
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: active-active-topology-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/topology/ci-smoke
          retention-days: 30

      - name: Upload live Kubernetes topology smoke reports
        if: always() && hashFiles('target/kubernetes/ci-smoke/**') != ''
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kubernetes-live-topology-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/kubernetes/ci-smoke
          retention-days: 30

      - name: Capture container dry-run evidence
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE_DIR="target/container-dry-run-evidence"
          IMAGE_TAG="loadbalancerpro:ci"
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          WORKFLOW_SHA="${GITHUB_SHA}"
          DRY_RUN_TAG="loadbalancerpro:ci-dry-run-${SOURCE_SHA}"
          mkdir -p "$EVIDENCE_DIR"

          docker tag "$IMAGE_TAG" "$DRY_RUN_TAG"
          docker version > "$EVIDENCE_DIR/docker-version.txt"
          docker image inspect "$DRY_RUN_TAG" > "$EVIDENCE_DIR/image-inspect.json"
          docker image history --no-trunc "$DRY_RUN_TAG" > "$EVIDENCE_DIR/image-history.txt"
          docker image ls loadbalancerpro > "$EVIDENCE_DIR/image-list.txt"
          docker image inspect "$DRY_RUN_TAG" --format '{{.Id}}' > "$EVIDENCE_DIR/image-id.txt"
          docker image inspect "$DRY_RUN_TAG" --format '{{json .RepoDigests}}' > "$EVIDENCE_DIR/repo-digests.json"
          docker image inspect "$DRY_RUN_TAG" --format '{{json .Config.Labels}}' > "$EVIDENCE_DIR/image-labels.json"
          docker image inspect "$DRY_RUN_TAG" --format '{{json .Config.Entrypoint}}' > "$EVIDENCE_DIR/image-entrypoint.json"
          docker image inspect "$DRY_RUN_TAG" --format '{{json .Config.Cmd}}' > "$EVIDENCE_DIR/image-cmd.json"
          docker image inspect "$DRY_RUN_TAG" --format '{{json .Config.ExposedPorts}}' > "$EVIDENCE_DIR/image-exposed-ports.json"

          {
            echo "# Container Dry-Run Evidence"
            echo ""
            echo "- Source commit SHA: ${SOURCE_SHA}"
            echo "- Workflow SHA: ${WORKFLOW_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Source image tag: \`${IMAGE_TAG}\`"
            echo "- Local dry-run image tag: \`${DRY_RUN_TAG}\`"
            echo "- Docker runtime and proxy-prod Compose smokes: passed before this evidence was captured."
            echo "- Trivy scans: see \`trivy-summary.txt\`, \`fixture-trivy-summary.txt\`, \`topology-ingress-trivy-summary.txt\`, and \`immutable-candidate-trivy-summary.txt\` when the scan steps complete."
            echo "- Image SBOM: see \`image-sbom.cdx.json\`, \`image-sbom.cdx.sha256\`, and \`image-sbom-binding.json\` when image SBOM generation completes."
            echo "- Evidence directory: \`${EVIDENCE_DIR}\`"
            echo "- Artifact name: \`container-dry-run-evidence-no-publish-no-sign\`"
            echo ""
            echo "## Boundary"
            echo ""
            echo "- No container was published."
            echo "- No container was signed."
            echo "- No registry login was performed."
            echo "- No registry credentials were used."
            echo "- No release, tag, or GitHub Release was created."
            echo "- This is local-only image evidence, not production certification."
          } > "$EVIDENCE_DIR/dry-run-summary.md"

      - name: Scan Docker image
        # aquasecurity/trivy-action@0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: loadbalancerpro:ci
          format: table
          output: target/container-dry-run-evidence/trivy-summary.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Generate image CycloneDX SBOM
        # aquasecurity/trivy-action@0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: loadbalancerpro:ci-dry-run-${{ github.event.pull_request.head.sha || github.sha }}
          format: cyclonedx
          output: target/container-dry-run-evidence/image-sbom.cdx.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Validate image CycloneDX SBOM evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash -n scripts/smoke/validate-container-image-sbom.sh
          bash scripts/smoke/validate-container-image-sbom.sh \
            target/container-dry-run-evidence \
            "$SOURCE_SHA" \
            "$GITHUB_SHA" \
            "loadbalancerpro:ci-dry-run-${SOURCE_SHA}"

      - name: Scan proxy-prod fixture image
        # aquasecurity/trivy-action@0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: loadbalancerpro:proxy-prod-fixture-ci
          format: table
          output: target/container-dry-run-evidence/fixture-trivy-summary.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Scan active-active ingress fixture image
        # aquasecurity/trivy-action@0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: loadbalancerpro:topology-ingress-ci
          format: table
          output: target/container-dry-run-evidence/topology-ingress-trivy-summary.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Scan immutable rollout candidate image
        # aquasecurity/trivy-action@0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: loadbalancerpro:immutable-candidate-ci
          format: table
          output: target/container-dry-run-evidence/immutable-candidate-trivy-summary.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload container dry-run evidence
        if: always() && hashFiles('target/container-dry-run-evidence/**') != ''
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-dry-run-evidence-no-publish-no-sign
          path: target/container-dry-run-evidence
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.repository == 'RicheyWorks/LoadBalancerPro'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        # actions/checkout@v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Review dependency changes
        # actions/dependency-review-action@v4.8.0
        uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3
        with:
          fail-on-severity: high
