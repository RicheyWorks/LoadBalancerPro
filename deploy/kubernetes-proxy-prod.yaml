# Static manifest sketch only. Replace local image and referenced Secret/ConfigMap objects before any deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadbalancerpro-proxy-prod
data:
  LBP_UPSTREAM_0_URL: http://backend-a:8080
  LBP_UPSTREAM_1_URL: http://backend-b:8080
  LBP_TLS_HOSTNAME: lbp.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadbalancerpro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadbalancerpro
  template:
    metadata:
      labels:
        app: loadbalancerpro
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadbalancerpro
          image: loadbalancerpro:replace-with-reviewed-local-image
          imagePullPolicy: Never
          args:
            - --server.address=0.0.0.0
            - --server.ssl.enabled=true
            - --server.ssl.bundle=proxyprod
            - --spring.ssl.bundle.pem.proxyprod.keystore.certificate=file:/run/tls/certificate.pem
            - --spring.ssl.bundle.pem.proxyprod.keystore.private-key=file:/run/tls/private-key.pem
            - --spring.ssl.bundle.pem.proxyprod.reload-on-update=true
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,proxy-prod
            - name: SPRING_CONFIG_IMPORT
              value: configtree:/run/secrets/
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: optional:file:/run/config/
          envFrom:
            - configMapRef:
                name: loadbalancerpro-proxy-prod
          ports:
            - name: https
              containerPort: 8080
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert /run/tls/ca.pem
                  --resolve "${LBP_TLS_HOSTNAME}:8080:127.0.0.1"
                  "https://${LBP_TLS_HOSTNAME}:8080/api/health" > /dev/null
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert /run/tls/ca.pem
                  --resolve "${LBP_TLS_HOSTNAME}:8080:127.0.0.1"
                  "https://${LBP_TLS_HOSTNAME}:8080/api/health" > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: api-key
              mountPath: /run/secrets
              readOnly: true
            - name: server-tls
              mountPath: /run/tls
              readOnly: true
            - name: backend-trust
              mountPath: /run/trust
              readOnly: true
            - name: backend-identity
              mountPath: /run/identity
              readOnly: true
            - name: external-config
              mountPath: /run/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: api-key
          secret:
            secretName: loadbalancerpro-api-key
            items:
              - key: api-key
                path: loadbalancerpro.api.key
        - name: server-tls
          secret:
            secretName: loadbalancerpro-server-tls
            items:
              - key: tls.crt
                path: certificate.pem
              - key: tls.key
                path: private-key.pem
              - key: ca.crt
                path: ca.pem
        - name: backend-trust
          secret:
            secretName: loadbalancerpro-backend-trust
            optional: true
        - name: backend-identity
          secret:
            secretName: loadbalancerpro-backend-identity
            optional: true
        - name: external-config
          configMap:
            name: loadbalancerpro-external-config
            optional: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancerpro
spec:
  type: ClusterIP
  selector:
    app: loadbalancerpro
  ports:
    - name: https
      port: 443
      targetPort: https
