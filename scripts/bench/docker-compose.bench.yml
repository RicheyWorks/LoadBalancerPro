services:
  loadbalancerpro:
    environment:
      LBP_CONNECT_TIMEOUT: 1s
      LBP_REQUEST_TIMEOUT: 5s
      LBP_HEALTH_CHECK_INTERVAL: 1s
      LBP_HEALTHY_THRESHOLD: 1
      LBP_UNHEALTHY_THRESHOLD: 1
      LBP_COOLDOWN_DURATION: 1s
      LBP_DRAIN_TIMEOUT: 10s
      LBP_SLOW_START_DURATION: 0s
      LOADBALANCERPRO_PROXY_RETRY_ENABLED: "true"
      LOADBALANCERPRO_PROXY_RETRY_MAX_ATTEMPTS: 2
      LOADBALANCERPRO_PROXY_RETRY_BUDGET_PERCENT: 100
      LOADBALANCERPRO_PROXY_RETRY_BACKOFF_BASE: 10ms
      LOADBALANCERPRO_PROXY_RETRY_BACKOFF_MAX: 50ms
